name: E2E Foundation v1 (informational)

# ============================================================================
# SCANYM E2E AUTOMATION FOUNDATION v1 (issue #11, comments `5886339688`,
# `5894999069`, `5896211327`).
#
# Deterministic Playwright/Chromium executor, SEPARATE from the existing
# Node/jsdom suite (tests/*.test.ts, run via `npm test`) and from
# `restaurant-context-critical-regression-gate.yml` -- never merged into
# either, never replaces either.
#
# v1 IS INFORMATIONAL / NON-BLOCKING BY DESIGN (approved CIO preference,
# comment `5896211327`, section 2): it does NOT gate merges or the
# release train. Failures here are visible and investigated by a human,
# not auto-retried, not silently ignored either. After a burn-in period
# with zero flakes on the stable scenarios, promoting specific scenarios
# to a required/blocking check is a SEPARATE, explicit follow-up change
# to branch protection -- not something this workflow does on its own.
#
# READ-ONLY ONLY: every scenario under e2e/ only navigates and reads --
# no cart mutation, no checkout, no Production data is ever written by
# this workflow.
# ============================================================================

on:
  push:
    branches:
      - main
  # Scoped to the E2E layer itself (not every PR): lets THIS lot's own
  # PR get a real execution before merge/review, and any FUTURE PR that
  # touches the E2E layer get one too, without adding browser-test
  # latency/cost to ordinary feature PRs that never touch e2e/.
  # `workflow_dispatch` alone cannot do this: GitHub only allows
  # dispatching a workflow that already exists on the default branch,
  # so a brand-new workflow has no way to get its first real run before
  # being on `main` without either this, or merging first (not done
  # here -- this PR stays draft).
  pull_request:
    branches:
      - main
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e-foundation-v1.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: read
  # Nécessaire UNIQUEMENT pour l'étape "Post failure summary to PR"
  # ci-dessous (diagnostic, gated sur `github.event_name ==
  # 'pull_request' && failure()`) : les endpoints de logs/artefacts
  # GitHub (`.../actions/jobs/{id}/logs`, `.../actions/artifacts/{id}/zip`)
  # redirigent (302) vers un stockage blob Azure inatteignable depuis
  # l'environnement d'investigation habituel (voir issue #11) -- un
  # commentaire posté ici, via `api.github.com` (toujours atteignable),
  # est donc le seul canal fiable pour voir le détail réel d'un échec
  # Playwright. N'accorde jamais d'écriture sur `contents`, `issues`, ou
  # quoi que ce soit d'autre.
  pull-requests: write

jobs:
  e2e-foundation-v1:
    name: E2E Foundation v1 (Chromium, mobile + desktop, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E Foundation v1 scenarios
        id: e2e
        env:
          # Chemin public en lecture seule -- jamais un secret, jamais
          # un tenant de mutation. Peut être redéfini via
          # workflow_dispatch/environment sans toucher au code des
          # scénarios (voir playwright.config.ts).
          PLAYWRIGHT_BASE_URL: https://scanym-sanaa.vercel.app
        shell: bash
        run: |
          set -o pipefail
          # Sortie du reporter "list" dupliquée dans un fichier (jamais
          # committé, voir .gitignore) pour l'étape de diagnostic
          # ci-dessous -- seul moyen de voir le détail réel d'un échec
          # depuis un environnement qui ne peut pas atteindre le
          # stockage blob des logs/artefacts GitHub (voir issue #11).
          npx playwright test 2>&1 | tee playwright-run.log

      - name: Upload Playwright report (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: Upload traces/screenshots (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.sha }}
          path: test-results/
          retention-days: 7

      - name: Post failure summary to PR (diagnostic, informational)
        # Gated sur pull_request : un run workflow_dispatch n'a pas de PR
        # associée à commenter. N'écrit jamais sur `main`, ne modifie
        # aucun fichier du dépôt, ne débloque ni ne bloque rien -- un
        # commentaire de plus, purement informationnel, au même titre que
        # l'annotation ::warning:: de l'étape "Result summary" ci-dessous.
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tail -n 200 playwright-run.log > /tmp/playwright-tail.log 2>/dev/null || echo "(aucun log capturé)" > /tmp/playwright-tail.log
          {
            echo "### E2E Foundation v1 -- échec informationnel à \`${COMMIT_SHA}\`"
            echo ""
            echo "Commentaire posté automatiquement par \`e2e-foundation-v1.yml\` (voir issue #11) : les endpoints de logs/artefacts GitHub redirigent vers un stockage blob inatteignable depuis l'environnement d'investigation habituel -- ce commentaire est donc le seul canal permettant de voir le détail réel de l'échec Playwright. Non bloquant en v1, ne modifie rien d'autre."
            echo ""
            echo "<details><summary>Dernières lignes du run Playwright (tronqué à 200 lignes)</summary>"
            echo ""
            echo '```'
            cat /tmp/playwright-tail.log
            echo '```'
            echo ""
            echo "</details>"
          } > /tmp/playwright-comment-body.txt
          jq -Rs '{body: .}' /tmp/playwright-comment-body.txt > /tmp/playwright-comment.json
          curl -sS -o /tmp/curl-response.json -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -d @/tmp/playwright-comment.json

      - name: Result summary
        if: always()
        run: |
          if [ "${{ steps.e2e.outcome }}" != "success" ]; then
            echo "::warning::E2E Foundation v1 FAILED at commit ${{ github.sha }}. This is INFORMATIONAL ONLY in v1 -- it does not block merges or the release train. Download the uploaded artifacts (Playwright report + traces/screenshots) and investigate: product regression, environment/network flake, or an obsolete scenario. See issue #11 for the approved v1 design and constraints."
          else
            echo "E2E Foundation v1: all scenarios passed at commit ${{ github.sha }}."
          fi
