name: postmerge-smoke-check
on:
  workflow_dispatch:
  push:
    branches: [ ci/postmerge-smoke-check ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP checks with fuller body preview
        run: |
          set +e
          check() {
            local url="$1"
            local label="$2"
            code=$(curl -s -o /tmp/body.html -w "%{http_code}" -L --max-time 15 "$url")
            bytes=$(wc -c < /tmp/body.html)
            preview=$(tr -d '\n' < /tmp/body.html | tr -s ' ' | cut -c1-500)
            echo "::notice title=${label}::url=${url} http=${code} bytes=${bytes} preview=${preview}"
          }
          check "https://scandz-fpitp8s7o-scandz1.vercel.app/" "vercel-scandz-prod-root"
          check "https://scandz-fpitp8s7o-scandz1.vercel.app/r/aulaitcru" "vercel-scandz-prod-r-aulaitcru"
          check "https://scanym-sanaa-iduw9n55y-scandz1.vercel.app/" "vercel-scanym-sanaa-prod-root"
          check "https://scanym.com/" "scanym-root-recheck"
          check "https://www.scanym.com/" "www-scanym-root-recheck"
