name: postmerge-smoke-check
on:
  workflow_dispatch:
  push:
    branches: [ ci/postmerge-smoke-check ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Real storefront - detailed check
        run: |
          set +e
          curl -s -o /tmp/body.html -w "HTTPCODE=%{http_code}\n" --max-time 20 "https://scanym-sanaa.vercel.app/r/au-lait-cru" > /tmp/code.txt
          cat /tmp/code.txt
          echo "::notice title=http-code-no-redirect::$(cat /tmp/code.txt)"
          bytes=$(wc -c < /tmp/body.html)
          echo "::notice title=bytes::${bytes}"
          # how many times does the not-found phrase appear, and in what context (near a <script> tag = js bundle false positive, near <main>/<h1> = real page)
          ctx=$(grep -o '.\{60\}Restaurant introuvable.\{60\}' /tmp/body.html | head -3)
          echo "::notice title=notfound-context::${ctx}"
          # product/menu content
          prod=$(grep -oE '.{30}(uf|Oeuf|Lait cru|Retrait uniquement|Delivery|Pickup|Panier|Cart|price|prix|EUR|€).{30}' /tmp/body.html | head -8 | tr '\n' '|')
          echo "::notice title=product-content::${prod}"
          # h1/main tag near top of body (server rendered heading)
          h1=$(grep -oE '<h1[^>]*>[^<]{0,80}' /tmp/body.html | head -3 | tr '\n' '|')
          echo "::notice title=h1-tags::${h1}"
          # check for restaurant name text
          rname=$(grep -oc "Au Lait Cru" /tmp/body.html)
          echo "::notice title=restaurant-name-count::${rname}"
