name: postmerge-smoke-check
on:
  workflow_dispatch:
  push:
    branches: [ ci/postmerge-smoke-check ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: DNS resolution check
        run: |
          set +e
          echo "::notice title=dns-scanym::$(dig +short scanym.com A | tr '\n' ',')"
          echo "::notice title=dns-www-scanym::$(dig +short www.scanym.com CNAME A | tr '\n' ',')"
          echo "::notice title=dns-vercel-scandz::$(dig +short scandz-fpitp8s7o-scandz1.vercel.app A | tr '\n' ',')"
          echo "::notice title=whois-snippet::$(curl -s https://ipinfo.io/$(dig +short scanym.com A | head -1)/org 2>/dev/null | tr -d '\n')"
