name: postmerge-smoke-check
on:
  workflow_dispatch:
  push:
    branches: [ ci/postmerge-smoke-check ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Deep content checks
        run: |
          set +e
          check() {
            local url="$1"
            local label="$2"
            code=$(curl -s -o /tmp/body.html -w "%{http_code}" -L --max-time 15 "$url")
            bytes=$(wc -c < /tmp/body.html)
            has_notfound=$(grep -c "Restaurant introuvable" /tmp/body.html)
            has_error=$(grep -Eic "application error|internal server error|unhandled runtime|digest.:" /tmp/body.html)
            has_oeufs=$(grep -ic "Retrait uniquement\|delivery\|pickup\|menu" /tmp/body.html)
            echo "::notice title=${label}::url=${url} http=${code} bytes=${bytes} restaurant_introuvable=${has_notfound} error_signature=${has_error} menu_keywords=${has_oeufs}"
          }
          check "https://scandz-fpitp8s7o-scandz1.vercel.app/r/aulaitcru" "real-slug-aulaitcru"
          check "https://scandz-fpitp8s7o-scandz1.vercel.app/r/definitely-bogus-xyz-999" "bogus-slug-control"
