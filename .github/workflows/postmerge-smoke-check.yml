name: postmerge-smoke-check
on:
  workflow_dispatch:
  push:
    branches: [ ci/postmerge-smoke-check ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP checks with body preview
        run: |
          set +e
          check() {
            local url="$1"
            local label="$2"
            code=$(curl -s -o /tmp/body.html -w "%{http_code}" -L --max-time 15 "$url")
            bytes=$(wc -c < /tmp/body.html)
            preview=$(tr -d '\n' < /tmp/body.html | tr -s ' ' | cut -c1-300)
            echo "::notice title=${label}::url=${url} http=${code} bytes=${bytes} preview=${preview}"
          }
          check "https://scanym.com/" "root"
          check "https://scanym.com/r/aulaitcru" "r-aulaitcru"
          check "https://scanym.com/nonexistent-xyz-check" "generic-404-baseline"
          check "https://scanym.com/dashboard/login" "dashboard-login"
