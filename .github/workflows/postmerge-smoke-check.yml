name: postmerge-smoke-check
on:
  workflow_dispatch:
  push:
    branches: [ ci/postmerge-smoke-check ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Real storefront smoke check
        run: |
          set +e
          check() {
            local url="$1"
            local label="$2"
            code=$(curl -s -o /tmp/body_$label.html -w "%{http_code}" -L --max-time 15 "$url")
            bytes=$(wc -c < /tmp/body_$label.html)
            notfound=$(grep -c "Restaurant introuvable" /tmp/body_$label.html)
            errsig=$(grep -Eic "application error|internal server error|unhandled runtime|digest.:|502 Bad Gateway|503 Service" /tmp/body_$label.html)
            title=$(grep -o '<title[^>]*>[^<]*</title>' /tmp/body_$label.html | head -1)
            echo "::notice title=${label}::url=${url} http=${code} bytes=${bytes} restaurant_introuvable=${notfound} error_signature=${errsig} title=${title}"
          }
          check "https://scanym-sanaa.vercel.app/r/au-lait-cru" "aulaitcru-real"
          check "https://scanym-sanaa.vercel.app/r/definitely-bogus-xyz-999" "bogus-control"
          check "https://scanym-sanaa.vercel.app/" "storefront-root"
      - name: Extract product/restriction snippets
        run: |
          echo "=== oeufs/lait cru mentions ==="
          grep -oE '.{40}(uf|Oeuf|Lait cru|Retrait uniquement|pickup only|Mode de service).{40}' /tmp/body_aulaitcru-real.html | head -10
          echo "=== restaurant name check ==="
          grep -oE '.{20}(Au Lait Cru|au-lait-cru).{20}' /tmp/body_aulaitcru-real.html | head -5
