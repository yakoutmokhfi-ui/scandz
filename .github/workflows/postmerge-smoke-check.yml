name: postmerge-smoke-check
on:
  workflow_dispatch:
  push:
    branches: [ ci/postmerge-smoke-check ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: PSM restriction badge check
        run: |
          set +e
          curl -s -o /tmp/body.html --max-time 20 "https://scanym-sanaa.vercel.app/r/au-lait-cru"
          restrict=$(grep -oE '.{20}(Retrait uniquement|livraison|Delivery|delivery|Mode de service limit|Non disponible).{40}' /tmp/body.html | sort -u | head -10 | tr '\n' '|')
          echo "::notice title=restriction-mentions::${restrict}"
          # count of product cards
          cards=$(grep -oc '"price"' /tmp/body.html)
          echo "::notice title=price-field-count::${cards}"
