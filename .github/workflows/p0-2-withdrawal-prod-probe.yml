name: p0-2-withdrawal-prod-probe
on:
  push:
    branches:
      - ci/p0-2-withdrawal-prod-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the scandz-project Production deployment URL directly
        run: |
          HOST="scandz-54qo0f6p0-scandz1.vercel.app"
          echo "::notice::--- GET https://${HOST}/ (this project's OWN Production-tagged deployment URL) ---"
          curl -sS -D /tmp/h1.txt -o /tmp/b1.html -m 15 "https://${HOST}/" || echo "::notice::unreachable"
          echo "::notice::headers=$(cat /tmp/h1.txt 2>/dev/null | tr '\n' '|')"
          echo "::notice::snippet=$(head -c 500 /tmp/b1.html 2>/dev/null | tr '\n' ' ')"

          echo "::notice::--- GET https://scandz.vercel.app/ full headers (checking for vercel auth / access-restriction markers) ---"
          curl -sS -D /tmp/h2.txt -o /tmp/b2.html -m 15 "https://scandz.vercel.app/"
          echo "::notice::headers2=$(cat /tmp/h2.txt | tr '\n' '|')"
          echo "::notice::snippet2=$(head -c 1200 /tmp/b2.html | tr '\n' ' ')"
